<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web QLab - Mobile & Tablet Responsive Cue Player</title>
  <style>
    :root {
      --bg-dark: #121214;
      --panel-bg: #1e1e24;
      --panel-border: #2d2d38;
      --accent-green: #28a745;
      --accent-orange: #fd7e14;
      --accent-red: #dc3545;
      --accent-blue: #007bff;
      --text-main: #f0f0f0;
      --text-muted: #8a8a9e;
      --selected-bg: #2d3142;
    }

    * { 
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 10px;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      touch-action: manipulation;
    }

    header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas: 
        "waveform waveform"
        "go panic";
      gap: 10px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
    }

    @media (min-width: 768px) {
      header {
        grid-template-columns: 180px 1fr 180px;
        grid-template-areas: "go waveform panic";
        height: 120px;
      }
    }

    .btn-go {
      grid-area: go;
      background-color: var(--accent-green);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      min-height: 60px;
      box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
      transition: background-color 0.2s ease;
    }
    .btn-go.paused {
      background-color: var(--accent-orange);
      box-shadow: 0 4px 10px rgba(253, 126, 20, 0.3);
    }
    .btn-go:active { transform: scale(0.97); }

    .btn-panic {
      grid-area: panic;
      background-color: var(--accent-red);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      min-height: 60px;
    }
    .btn-panic:active { transform: scale(0.97); }

    .waveform-display {
      grid-area: waveform;
      background: #0a0a0c;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      height: 80px;
      cursor: pointer;
    }
    @media (min-width: 768px) {
      .waveform-display { height: 100%; }
    }

    canvas { width: 100%; height: 100%; display: block; }

    .time-info {
      position: absolute;
      top: 5px;
      right: 10px;
      font-family: monospace;
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 4px;
      pointer-events: none;
    }

    .workspace {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    @media (min-width: 900px) {
      .workspace {
        display: grid;
        grid-template-columns: 1fr 320px;
      }
    }

    .cue-list-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      min-height: 300px;
    }

    .drop-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 123, 255, 0.25);
      border: 3px dashed var(--accent-blue);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      z-index: 10;
    }

    .cue-list-panel.drag-over .drop-overlay { opacity: 1; }

    .toolbar {
      padding: 10px;
      background: #18181c;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .file-input-btn, .btn-secondary {
      background: var(--accent-blue);
      color: white;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      border: none;
      display: inline-block;
      text-align: center;
    }
    .btn-secondary { background: #3a3a4c; font-weight: normal; }

    .drop-hint {
      font-size: 11px;
      color: var(--text-muted);
      width: 100%;
    }
    @media (min-width: 600px) {
      .drop-hint { width: auto; }
    }

    .table-wrapper { 
      flex: 1; 
      overflow-y: auto; 
      max-height: 50vh;
    }
    @media (min-width: 900px) {
      .table-wrapper { max-height: none; }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #18181c;
      padding: 12px 10px;
      color: var(--text-muted);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    td { 
      padding: 14px 10px;
      border-bottom: 1px solid var(--panel-border); 
    }

    tr.cue-row { cursor: pointer; user-select: none; }
    tr.cue-row:active { background: #2f2f3e; }
    tr.cue-row.selected { background: var(--selected-bg); }
    tr.cue-row.playing { border-left: 4px solid var(--accent-green); background: rgba(40, 167, 69, 0.15); }
    tr.cue-row.paused { border-left: 4px solid var(--accent-orange); background: rgba(253, 126, 20, 0.15); }

    .inspector-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .inspector-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--text-muted);
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 8px;
      margin: 0;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; color: var(--text-muted); }
    .form-group input[type="number"], 
    .form-group input[type="text"] {
      background: #121214;
      border: 1px solid var(--panel-border);
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-size: 16px;
    }

    .form-group input[type="range"] { height: 30px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  </style>
</head>
<body>

  <header>
    <button class="btn-go" id="goBtn">GO</button>
    <div class="waveform-display" id="waveformContainer">
      <canvas id="waveformCanvas"></canvas>
      <div class="time-info" id="timeInfo">00:00 / 00:00</div>
    </div>
    <button class="btn-panic" id="panicBtn">PANIC</button>
  </header>

  <div class="workspace">
    <div class="cue-list-panel" id="dropZone">
      <div class="drop-overlay">ここに音声ファイルをドロップ</div>
      
      <div class="toolbar">
        <label class="file-input-btn">
          + 音声ファイルを選択
          <input type="file" id="audioFileInput" accept="audio/*" multiple style="display:none;">
        </label>
        <button class="btn-secondary" id="clearStorageBtn">データ全消去</button>
        <span class="drop-hint">※PCではドラッグ＆ドロップでも追加可能</span>
      </div>
      
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 50px;">Cue</th>
              <th>Target Name</th>
              <th style="width: 70px;">Start</th>
              <th style="width: 60px;">In</th>
              <th style="width: 60px;">Out</th>
            </tr>
          </thead>
          <tbody id="cueTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="inspector-panel">
      <h3 class="inspector-title">CUE INSPECTOR</h3>
      <div id="inspectorContent">
        <p style="color: var(--text-muted); font-size: 13px;">キューを選択してください</p>
      </div>
    </div>
  </div>

<script>
  // IndexedDB 構築
  const DB_NAME = 'WebQLabDB_v2';
  const DB_VERSION = 1;
  let db = null;

  function initDB() {
    return new Promise((resolve, reject) => {
      if (db) return resolve(db);
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (e) => {
        const instance = e.target.result;
        if (!instance.objectStoreNames.contains('audioBlobs')) {
          instance.createObjectStore('audioBlobs');
        }
      };
      request.onsuccess = (e) => {
        db = e.target.result;
        resolve(db);
      };
      request.onerror = (e) => reject(e);
    });
  }

  function saveAudioBlob(id, blob) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('audioBlobs', 'readwrite');
      const store = tx.objectStore('audioBlobs');
      const req = store.put(blob, id.toString());
      req.onsuccess = () => resolve();
      req.onerror = (err) => reject(err);
    });
  }

  function getAudioBlob(id) {
    return new Promise((resolve) => {
      const tx = db.transaction('audioBlobs', 'readonly');
      const store = tx.objectStore('audioBlobs');
      const req = store.get(id.toString());
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  }

  function clearDB() {
    if (!db) return;
    const tx = db.transaction('audioBlobs', 'readwrite');
    tx.objectStore('audioBlobs').clear();
  }

  // Web Audio Context
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudioEngine() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  const unlockAudio = () => {
    initAudioEngine();
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('click', unlockAudio);
  };
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click', unlockAudio, { once: true });

  let cueList = [];
  let selectedCueIndex = 0;
  let cueCounter = 1;

  class Cue {
    constructor(id, name, blob, audioBuffer) {
      this.id = id;
      this.name = name;
      this.blob = blob;
      this.buffer = audioBuffer;
      this.startTime = 0;
      this.fadeIn = 0.0;
      this.fadeOut = 1.0;
      this.volume = 1.0;
      this.loop = false;

      this.sourceNode = null;
      this.gainNode = null;
      this.isPlaying = false;
      this.isPaused = false;
      this.pausedAt = 0;
      this.startedAt = 0;
    }

    play() {
      initAudioEngine();

      let offset = this.isPaused ? this.pausedAt : this.startTime;

      if (this.sourceNode) {
        try { this.sourceNode.stop(); } catch(e){}
        this.sourceNode.disconnect();
      }

      this.sourceNode = audioCtx.createBufferSource();
      this.sourceNode.buffer = this.buffer;
      this.sourceNode.loop = this.loop;

      if (this.loop) {
        this.sourceNode.loopStart = this.startTime;
        this.sourceNode.loopEnd = this.buffer.duration;
      }

      this.gainNode = audioCtx.createGain();
      const now = audioCtx.currentTime;

      if (this.fadeIn > 0 && !this.isPaused) {
        this.gainNode.gain.setValueAtTime(0, now);
        this.gainNode.gain.linearRampToValueAtTime(this.volume, now + parseFloat(this.fadeIn));
      } else {
        this.gainNode.gain.setValueAtTime(this.volume, now);
      }

      this.sourceNode.connect(this.gainNode);
      this.gainNode.connect(audioCtx.destination);

      this.sourceNode.start(0, offset);
      this.startedAt = now - offset;
      this.isPlaying = true;
      this.isPaused = false;

      this.sourceNode.onended = () => {
        if (!this.isPaused) {
          this.isPlaying = false;
          this.pausedAt = 0;

          // Loop未設定かつ自然終了した場合、次のキューへ選択を移動
          if (!this.loop) {
            this.advanceToNextCue(this.id);
          } else {
            renderCueList();
          }
        }
      };
    }

    advanceToNextCue(finishedCueId) {
      const finishedIndex = cueList.findIndex(c => c.id === finishedCueId);
      if (finishedIndex !== -1 && finishedIndex < cueList.length - 1) {
        selectedCueIndex = finishedIndex + 1;
      }
      renderCueList();
    }

    pause() {
      if (!this.isPlaying) return;

      this.pausedAt = this.getCurrentTime();
      this.isPaused = true;
      this.isPlaying = false;

      if (this.sourceNode) {
        try { this.sourceNode.stop(); } catch(e){}
        this.sourceNode.disconnect();
      }
      renderCueList();
    }

    stop(fadeTime = this.fadeOut) {
      if ((!this.isPlaying && !this.isPaused) || !this.sourceNode) {
        this.resetPosition();
        return;
      }

      const now = audioCtx.currentTime;
      const fade = parseFloat(fadeTime);

      if (fade > 0 && this.gainNode && this.isPlaying) {
        this.gainNode.gain.setValueAtTime(this.gainNode.gain.value, now);
        this.gainNode.gain.linearRampToValueAtTime(0.001, now + fade);
        setTimeout(() => {
          this.resetPosition();
        }, fade * 1000);
      } else {
        this.resetPosition();
      }
    }

    resetPosition() {
      if (this.sourceNode) {
        try { this.sourceNode.stop(); } catch(e){}
        this.sourceNode.disconnect();
      }
      this.isPlaying = false;
      this.isPaused = false;
      this.pausedAt = 0;
      renderCueList();
    }

    getCurrentTime() {
      if (this.isPaused) return this.pausedAt;
      if (!this.isPlaying) return this.startTime;

      const elapsed = audioCtx.currentTime - this.startedAt;
      if (this.loop) {
        const loopDuration = this.buffer.duration - this.startTime;
        if (elapsed > this.startTime) {
          return this.startTime + ((elapsed - this.startTime) % loopDuration);
        }
      }
      return Math.min(elapsed, this.buffer.duration);
    }
  }

  // 波形描画
  function drawWaveform() {
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cue = cueList[selectedCueIndex];
    if (!cue || !cue.buffer) {
      document.getElementById('timeInfo').innerText = "00:00 / 00:00";
      return;
    }

    const buffer = cue.buffer;
    const rawData = buffer.getChannelData(0);
    const samples = 150;
    const blockSize = Math.floor(rawData.length / samples);
    const space = canvas.width / samples;

    ctx.fillStyle = '#4a4a5c';

    for (let i = 0; i < samples; i++) {
      let min = 1.0;
      let max = -1.0;
      for (let j = 0; j < blockSize; j++) {
        const datum = rawData[i * blockSize + j];
        if (datum < min) min = datum;
        if (datum > max) max = datum;
      }
      const y1 = ((1 + min) * canvas.height) / 2;
      const y2 = ((1 + max) * canvas.height) / 2;
      ctx.fillRect(i * space, y1, Math.max(1, space - 1), y2 - y1);
    }

    const duration = buffer.duration;
    const current = cue.getCurrentTime();

    const startX = (cue.startTime / duration) * canvas.width;
    ctx.fillStyle = '#28a745';
    ctx.fillRect(startX - 1, 0, 2, canvas.height);

    if (cue.isPlaying || cue.isPaused) {
      const currentX = (current / duration) * canvas.width;
      ctx.fillStyle = cue.isPaused ? '#fd7e14' : '#dc3545';
      ctx.fillRect(currentX - 1, 0, 3, canvas.height);
    }

    document.getElementById('timeInfo').innerText = 
      `${formatTime(current)} / ${formatTime(duration)}`;
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  document.getElementById('waveformContainer').addEventListener('click', (e) => {
    const cue = cueList[selectedCueIndex];
    if (!cue || !cue.buffer) return;

    const rect = e.currentTarget.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const ratio = clickX / rect.width;
    
    cue.startTime = Math.round(ratio * cue.buffer.duration * 100) / 100;
    cue.resetPosition();
    saveState();
    renderCueList();
  });

  function renderCueList() {
    const tbody = document.getElementById('cueTableBody');
    tbody.innerHTML = '';

    const currentCue = cueList[selectedCueIndex];
    const goBtn = document.getElementById('goBtn');
    
    if (currentCue && currentCue.isPlaying) {
      goBtn.innerText = "PAUSE";
      goBtn.classList.add('paused');
    } else if (currentCue && currentCue.isPaused) {
      goBtn.innerText = "RESUME";
      goBtn.classList.add('paused');
    } else {
      goBtn.innerText = "GO";
      goBtn.classList.remove('paused');
    }

    cueList.forEach((cue, index) => {
      const tr = document.createElement('tr');
      let statusClass = '';
      if (cue.isPlaying) statusClass = 'playing';
      else if (cue.isPaused) statusClass = 'paused';

      tr.className = `cue-row ${index === selectedCueIndex ? 'selected' : ''} ${statusClass}`;
      
      tr.onclick = () => {
        if (selectedCueIndex !== index) {
          selectedCueIndex = index;
          renderCueList();
        }
      };

      tr.innerHTML = `
        <td>Q${cue.id}</td>
        <td><strong>${cue.name}</strong></td>
        <td>${cue.startTime}s</td>
        <td>${cue.fadeIn}s</td>
        <td>${cue.fadeOut}s</td>
      `;
      tbody.appendChild(tr);
    });

    renderInspector();
    drawWaveform();
  }

  function renderInspector() {
    const container = document.getElementById('inspectorContent');
    const cue = cueList[selectedCueIndex];
    
    if (!cue) {
      container.innerHTML = `<p style="color: var(--text-muted); font-size: 13px;">キューを選択してください</p>`;
      return;
    }

    container.innerHTML = `
      <div class="form-group">
        <label>Cue Name</label>
        <input type="text" value="${cue.name}" onchange="updateSelectedCue('name', this.value)">
      </div>

      <div class="form-group">
        <label>Start Time (秒)</label>
        <input type="number" min="0" max="${cue.buffer ? cue.buffer.duration : 0}" step="0.1" value="${cue.startTime}" onchange="updateSelectedCue('startTime', this.value)">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Fade In (s)</label>
          <input type="number" min="0" step="0.5" value="${cue.fadeIn}" onchange="updateSelectedCue('fadeIn', this.value)">
        </div>
        <div class="form-group">
          <label>Fade Out (s)</label>
          <input type="number" min="0" step="0.5" value="${cue.fadeOut}" onchange="updateSelectedCue('fadeOut', this.value)">
        </div>
      </div>

      <div class="form-group">
        <label>Volume: ${Math.round(cue.volume * 100)}%</label>
        <input type="range" min="0" max="1" step="0.05" value="${cue.volume}" onchange="updateSelectedCue('volume', this.value)">
      </div>

      <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px;">
        <input type="checkbox" id="loopCheck" ${cue.loop ? 'checked' : ''} onchange="updateSelectedCue('loop', this.checked)" style="width:20px; height:20px;">
        <label for="loopCheck" style="cursor:pointer; font-size: 14px;">Loop Playback</label>
      </div>
    `;
  }

  function updateSelectedCue(key, value) {
    const cue = cueList[selectedCueIndex];
    if (!cue) return;
    
    cue[key] = (key === 'loop') ? value : (key === 'name' ? value : parseFloat(value));
    saveState();
    renderCueList();
  }

  // ドラッグ＆ドロップ
  const dropZone = document.getElementById('dropZone');

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, false);
  });

  dropZone.addEventListener('dragenter', () => dropZone.classList.add('drag-over'));
  dropZone.addEventListener('dragover', () => dropZone.classList.add('drag-over'));
  dropZone.addEventListener('dragleave', (e) => {
    if (e.target === dropZone) dropZone.classList.remove('drag-over');
  });

  dropZone.addEventListener('drop', async (e) => {
    dropZone.classList.remove('drag-over');
    const files = Array.from(e.dataTransfer.files);
    const audioFiles = files.filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(f.name));
    
    if (audioFiles.length > 0) {
      await processAudioFiles(audioFiles);
    }
  });

  function getCleanFileName(file) {
    if (!file || !file.name) return "Untitled Cue";
    return file.name.replace(/\.[^/.]+$/, "");
  }

  async function processAudioFiles(files) {
    initAudioEngine();
    await initDB();

    for (const file of files) {
      const blob = file;
      const cleanName = getCleanFileName(file);
      const arrayBuffer = await blob.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      
      const newCue = new Cue(cueCounter++, cleanName, blob, audioBuffer);
      cueList.push(newCue);
    }
    await saveState();
    renderCueList();
  }

  document.getElementById('audioFileInput').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (files.length > 0) {
      await processAudioFiles(files);
    }
  });

  // 保存・復元
  async function saveState() {
    await initDB();
    const serialized = cueList.map(cue => ({
      id: cue.id,
      name: cue.name,
      startTime: cue.startTime,
      fadeIn: cue.fadeIn,
      fadeOut: cue.fadeOut,
      volume: cue.volume,
      loop: cue.loop
    }));
    localStorage.setItem('webqlab_cues_v2', JSON.stringify(serialized));
    localStorage.setItem('webqlab_counter_v2', cueCounter);

    for (const cue of cueList) {
      if (cue.blob) {
        await saveAudioBlob(cue.id, cue.blob);
      }
    }
  }

  async function loadState() {
    await initDB();
    const savedMeta = localStorage.getItem('webqlab_cues_v2');
    const savedCounter = localStorage.getItem('webqlab_counter_v2');

    if (!savedMeta) return;

    cueCounter = parseInt(savedCounter) || 1;
    const parsed = JSON.parse(savedMeta);

    for (const item of parsed) {
      const blob = await getAudioBlob(item.id);
      if (blob) {
        try {
          initAudioEngine();
          const arrayBuffer = await blob.arrayBuffer();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          
          const cue = new Cue(item.id, item.name, blob, audioBuffer);
          cue.startTime = item.startTime || 0;
          cue.fadeIn = item.fadeIn;
          cue.fadeOut = item.fadeOut;
          cue.volume = item.volume;
          cue.loop = item.loop;

          cueList.push(cue);
        } catch(e) {
          console.error("Audio decode error:", e);
        }
      }
    }
    renderCueList();
  }

  document.getElementById('clearStorageBtn').addEventListener('click', () => {
    if (confirm("保存されている全てのキューと音声データを初期化しますか？")) {
      localStorage.clear();
      clearDB();
      cueList = [];
      selectedCueIndex = 0;
      cueCounter = 1;
      renderCueList();
    }
  });

  // GOボタンの挙動
  function triggerGo() {
    if (cueList.length === 0) return;
    const currentCue = cueList[selectedCueIndex];

    if (currentCue.isPlaying) {
      currentCue.pause();
    } else {
      currentCue.play();
    }
    renderCueList();
  }

  function stopAll() {
    cueList.forEach(cue => cue.stop(0.5));
  }

  document.getElementById('goBtn').addEventListener('click', triggerGo);
  document.getElementById('panicBtn').addEventListener('click', stopAll);

  function loop() {
    drawWaveform();
    requestAnimationFrame(loop);
  }
  loop();

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;

    if (e.code === 'Space') {
      e.preventDefault();
      triggerGo();
    } else if (e.code === 'Escape') {
      e.preventDefault();
      stopAll();
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      if (selectedCueIndex < cueList.length - 1) selectedCueIndex++;
      renderCueList();
    } else if (e.code === 'ArrowUp') {
      e.preventDefault();
      if (selectedCueIndex > 0) selectedCueIndex--;
      renderCueList();
    }
  });

  window.addEventListener('DOMContentLoaded', loadState);
</script>
</body>
</html>
